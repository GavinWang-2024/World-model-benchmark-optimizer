[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldoptbench"
version = "0.0.1"
description = "Architecture-agnostic benchmarking and optimization framework for world model inference"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gavin" }]

# Kept deliberately light. Torch/CUDA builds are hardware-specific (H100 vs
# 4090 vs Apple silicon) so install that yourself per your rented/HPC box's
# CUDA version rather than relying on this default. See build_plan.md Phase 0.
dependencies = [
    "numpy",
    "pandas",
    "pydantic",
    "huggingface_hub",
]

[project.optional-dependencies]
# Phase 1+: model loading and inference
ml = [
    "torch",
    "diffusers",
    "transformers",
    "accelerate",
    "torchmetrics",
    "torchao",
]
# Phase 8: worldserve. The server (worldoptbench/serve.py) is standard-library only, so it needs no
# extra packages beyond the model's own (`ml`); Pillow makes it return PNG frames instead of .npy.
serve = [
    "pillow",
]
# Phase 2/7: Pareto plots, drift curves
plot = [
    "matplotlib",
    "seaborn",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
worldserve = "worldoptbench.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["worldoptbench", "worldserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
